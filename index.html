function Pbar({v,max=100,color=T.teal,h=6}){
  return <div style={{background:"#EEF2F7",borderRadius:99,height:h,overflow:"hidden"}}>
    <div style={{width:`${Math.min(100,Math.round((v/max)*100))}%`,height:"100%",background:color,borderRadius:99,transition:"width 0.8s cubic-bezier(.4,0,.2,1)"}}/>

}

function Chip({label,color}){
  return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:color+"18",color}}>{label}</span>;
}

function Av({ini,size=40,idx=0,extra={}}){
  const c=AC[idx%AC.length];
  return <div style={{width:size,height:size,borderRadius:"50%",background:c.b,color:c.t,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.3,fontWeight:700,flexShrink:0,fontFamily:"'Sora',sans-serif",...extra}}>{ini}</div>;
}

function Ring({score,size=110}){
  const r=size/2-10,circ=2*Math.PI*r,off=circ-(score/100)*circ;
  const col=score>=80?T.emerald:score>=65?T.teal:score>=50?T.gold:T.rose;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#EEF2F7" strokeWidth={9}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={9}
      strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
      transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset 1s ease"}}/>
    <text x={size/2} y={size/2-4} textAnchor="middle" fontSize={size*0.19} fontWeight={800} fill={col} fontFamily="'Sora',sans-serif">{score}</text>
    <text x={size/2} y={size/2+size*0.13} textAnchor="middle" fontSize={size*0.1} fill={T.muted} fontFamily="'Sora',sans-serif">/100</text>
  </svg>;
}

    <div>

      {sub&&<div style={{fontSize:11,color:T.muted,marginTop:1}}>{sub}</div>}
    </div>
  </div>;
}

function Login({onLogin}){
  const [role,setRole]=useState("");
  const [name,setName]=useState("");

    {id:"student",icon:"🎓",label:"Student",desc:"Career roadmap, recommendations & mock interviews"},
    {id:"mentor",icon:"👨‍🏫",label:"Mentor",desc:"Monitor student progress and send action notes"},
    {id:"industry",icon:"🏢",label:"Industry Partner",desc:"Post internships and scout student talent"}

// ── Recommendations ───────────────────────────────────────────────────────────
function Recommendations(){
  const [active,setActive]=useState(STUDENTS[0]);
  const recs=s=>{
    const r=[];
    if(s.interests.includes("AI/ML"))r.push({type:"Course",title:"ML Specialization",platform:"Coursera",pri:"High",tag:"AI/ML"});
    if(s.interests.includes("Web Development"))r.push({type:"Course",title:"React / Next.js Masterclass",platform:"Udemy",pri:"High",tag:"Web"});
    if(s.interests.includes("Data Science"))r.push({type:"Cert",title:"Google Data Analytics",platform:"Coursera",pri:"Medium",tag:"Data"});
    if(s.interests.includes("Cybersecurity"))r.push({type:"Cert",title:"CompTIA Security+",platform:"CompTIA",pri:"High",tag:"Security"});
    if(s.interests.includes("Cloud Computing"))r.push({type:"Cert",title:"AWS Cloud Practitioner",platform:"Amazon",pri:"Medium",tag:"Cloud"});
    if(s.interests.includes("Mobile Development"))r.push({type:"Course",title:"Flutter & Dart Bootcamp",platform:"Udemy",pri:"Medium",tag:"Mobile"});
    if(s.goal==="Startup")r.push({type:"Project",title:"Build & launch a side product",platform:"Self-directed",pri:"High",tag:"Startup"});

    r.push({type:"Project",title:`Portfolio project in ${s.interests[0]||"your field"}`,platform:"GitHub",pri:"Medium",tag:"Portfolio"});

  return <div>

    </div>

      </div>

          <div>
            <div style={{fontSize:12.5,fontWeight:700,marginBottom:9}}>Skill Profile</div>
            {sel.pskills.map(s=><div key={s.n} style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:12}}>{s.n}</span><span style={{fontSize:12,fontWeight:700,color:s.v>=70?T.emerald:s.v>=55?T.teal:T.gold}}>{s.v}%</span></div>
              <Pbar v={s.v} color={s.v>=70?T.emerald:s.v>=55?T.teal:T.gold} h={5}/>
            </div>)}
          </div>
          <div>
            <div style={{fontSize:12.5,fontWeight:700,marginBottom:9}}>Contact</div>
            <div style={{background:T.bg,borderRadius:9,padding:"11px 13px",marginBottom:12}}>
              {[{l:"ID",v:sel.sid},{l:"Email",v:sel.email},{l:"Phone",v:sel.phone},{l:"Gender",v:sel.gender}].map(d=><div key={d.l} style={{display:"flex",gap:8,padding:"4px 0",borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:11,color:T.muted,minWidth:55}}>{d.l}</span>
                <span style={{fontSize:11,fontWeight:600,wordBreak:"break-all"}}>{d.v}</span>
              </div>)}
            </div>
            <button style={{width:"100%",padding:"10px",borderRadius:9,border:"none",background:T.ink,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'Sora',sans-serif"}}>📧 Invite to Interview</button>
          </div>
        </div>
      </div>
    </div>
  </div>;
}

// ── AI Mock Interview — FULLY WORKING with Anthropic API ──────────────────────
function MockInterview({user}){
  const defaultS=user&&user.role==="student"
    ?(STUDENTS.find(s=>s.name.toLowerCase().includes((user.name||"").toLowerCase().split(" ")[0]))||STUDENTS[0])
    :STUDENTS[0];

  const [selS,setSelS]=useState(defaultS);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [score,setScore]=useState(null);
  const [started,setStarted]=useState(false);
  const bottomRef=useRef();

  const greeting=s=>`Hi ${s.name}! I'm your AI interview coach.\n\nYou're a ${s.deg} student interested in ${s.interests.join(" & ")}, aiming for "${s.goal}". Let's run a mock interview tailored to your background.\n\nI'll ask you one question at a time. After each answer I'll give you honest feedback, then move to the next question. Ready?\n\n**First question:** Tell me about yourself — your background, what you've been working on, and why you're interested in ${s.interests[0]}.`;

  const startSession=()=>{
    setMsgs([{role:"ai",text:greeting(selS)}]);
    setStarted(true);
    setScore(null);
    setInput("");
  };

  const changeStudent=s=>{
    setSelS(s);
    setStarted(false);
    setMsgs([]);
    setScore(null);
    setInput("");
  };

  const send=async()=>{
    if(!input.trim()||loading||!started)return;
    const userText=input.trim();
    const newMsgs=[...msgs,{role:"user",text:userText}];
    setMsgs(newMsgs);
    setInput("");
    setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:500,
          system:`You are an experienced technical interviewer at a top Pakistani software company (Systems Limited, Arbisoft, 10Pearls). You are conducting a mock job interview for ${selS.name}.

Candidate profile:
- Degree: ${selS.deg} at ${selS.uni}
- Year ${selS.yr}, Semester ${selS.sem}, CGPA: ${selS.cgpa}
- Skills: ${selS.skills}
- Interests: ${selS.interests.join(", ")}
- Career goal: ${selS.goal}
- Work preference: ${selS.work}

Your job:
1. Read the candidate's answer carefully
2. Give ONE line of specific, honest feedback (what was strong, what was missing or vague)
3. Ask ONE new follow-up or next interview question relevant to their skills/goal
4. Alternate between technical (skills-based) and behavioural (situation-based) questions
5. Keep your entire reply under 5 sentences
6. Never repeat a question already asked
7. Use **bold** for the question you ask at the end`,
          messages:newMsgs.map(m=>({role:m.role==="ai"?"assistant":"user",content:m.text}))
        })
      });
      const data=await res.json();
      if(data.error){
        setMsgs(m=>[...m,{role:"ai",text:`⚠️ API Error: ${data.error.message}\n\nMake sure you are connected to the internet and the Anthropic API key is configured.`}]);
      } else {
        const aiText=data.content?.[0]?.text||"Something went wrong. Please try again.";
        setMsgs(m=>[...m,{role:"ai",text:aiText}]);
        const userCount=newMsgs.filter(m=>m.role==="user").length;
        if(userCount>=3&&!score){
          const avgLen=newMsgs.filter(m=>m.role==="user").reduce((s,m)=>s+m.text.length,0)/userCount;
          setScore(Math.min(95,Math.max(38,48+Math.round(avgLen/9)+Math.round(selS.ready/5))));
        }
      }
    }catch(e){
      setMsgs(m=>[...m,{role:"ai",text:`⚠️ Network error — please check your internet connection.\n\nError: ${e.message}`}]);
    }
    setLoading(false);
    setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
  };

  const renderText=t=>{
    // Simple bold rendering
    return t.split(/(\*\*[^*]+\*\*)/).map((part,i)=>{
      if(part.startsWith("**")&&part.endsWith("**"))
        return <strong key={i} style={{color:T.teal}}>{part.slice(2,-2)}</strong>;
      return <span key={i}>{part}</span>;
    });
  };

  return <div>
    {/* Student picker */}
    <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:13,padding:"16px 20px",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,fontFamily:"'Sora',sans-serif",marginBottom:10}}>🎤 Select Candidate for Mock Interview</div>
      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
        {STUDENTS.map((m,i)=><div key={m.id} onClick={()=>changeStudent(m)} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 10px",borderRadius:8,cursor:"pointer",background:selS.id===m.id?T.teal:T.bg,border:`1px solid ${selS.id===m.id?T.teal:T.border}`,transition:"all 0.12s"}}>
          <Av ini={m.ini} size={22} idx={i}/>
          <span style={{fontSize:11,fontWeight:600,color:selS.id===m.id?"#fff":T.text}}>{m.name.split(" ")[0]}</span>
        </div>)}
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 270px",gap:14}}>
      {/* Chat area */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:13,padding:"18px 22px",display:"flex",flexDirection:"column",minHeight:520}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14,paddingBottom:13,borderBottom:`1px solid ${T.border}`}}>
          <Av ini={selS.ini} size={38} idx={STUDENTS.findIndex(m=>m.id===selS.id)}/>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700}}>{selS.name}</div>
            <div style={{fontSize:12,color:T.muted}}>{selS.deg} · {selS.goal} · CGPA {selS.cgpa}</div>
          </div>
          {started&&<div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:T.emerald,animation:"blink 1.5s infinite"}}/>
            <span style={{fontSize:12,fontWeight:600,color:T.emerald}}>Live</span>
          </div>}
        </div>

        {/* Not started state */}
        {!started&&<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:"30px 0"}}>
          <div style={{fontSize:48}}>🎙️</div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:700,fontFamily:"'Sora',sans-serif",marginBottom:6}}>Ready to start?</div>
            <div style={{fontSize:13,color:T.muted,maxWidth:320,lineHeight:1.6}}>AI will ask real interview questions tailored to {selS.name}'s skills, background, and career goal. Answers are evaluated live.</div>
          </div>
          <button onClick={startSession} style={{padding:"13px 32px",borderRadius:11,border:"none",background:`linear-gradient(135deg,${T.teal},${T.tealD})`,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"'Sora',sans-serif",boxShadow:`0 4px 16px ${T.teal}40`}}>Start Interview →</button>
        </div>}

        {/* Messages */}
        {started&&<div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:11,marginBottom:14,maxHeight:360}}>
          {msgs.map((m,i)=><div key={i} style={{display:"flex",gap:9,alignItems:"flex-start",flexDirection:m.role==="user"?"row-reverse":"row",animation:"fadeIn 0.2s ease"}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:m.role==="ai"?T.ink:T.teal,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontSize:14}}>
              {m.role==="ai"?"🤖":selS.ini[0]}
            </div>
            <div style={{maxWidth:"78%",padding:"10px 14px",borderRadius:m.role==="ai"?"4px 13px 13px 13px":"13px 4px 13px 13px",background:m.role==="ai"?T.bg:T.teal+"14",fontSize:13,lineHeight:1.7,color:T.text,whiteSpace:"pre-wrap"}}>
              {m.role==="ai"?renderText(m.text):m.text}
            </div>
          </div>)}
          {loading&&<div style={{display:"flex",gap:9,alignItems:"center"}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:T.ink,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🤖</div>
            <div style={{padding:"10px 14px",borderRadius:"4px 13px 13px 13px",background:T.bg,fontSize:13,color:T.muted}}>
              <span style={{animation:"blink 1s infinite"}}>Thinking…</span>
            </div>
          </div>}
          <div ref={bottomRef}/>
        </div>}

        {/* Input */}
        {started&&<div style={{display:"flex",gap:9,paddingTop:13,borderTop:`1px solid ${T.border}`}}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder={`Answer as ${selS.name.split(" ")[0]}…`} style={{flex:1,padding:"10px 14px",borderRadius:9,border:`1.5px solid ${input.trim()?T.teal:T.border}`,fontSize:13,outline:"none",transition:"border 0.15s"}}/>
          <button onClick={send} disabled={loading||!input.trim()} style={{padding:"10px 20px",borderRadius:9,border:"none",background:loading||!input.trim()?T.light:T.teal,color:loading||!input.trim()?T.muted:"#fff",fontSize:13,fontWeight:700,cursor:loading||!input.trim()?"not-allowed":"pointer",transition:"all 0.15s",fontFamily:"'Sora',sans-serif",minWidth:70}}>
            {loading?"…":"Send"}
          </button>
        </div>}
      </div>

      {/* Right panel */}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:13,padding:"16px 18px"}}>
          <div style={{fontSize:13,fontWeight:700,fontFamily:"'Sora',sans-serif",marginBottom:10}}>Candidate Profile</div>
          <div style={{display:"flex",justifyContent:"center",marginBottom:8}}><Ring score={selS.ready} size={90}/></div>
          <div style={{fontSize:11,color:T.muted,textAlign:"center",marginBottom:12}}>Career Readiness Score</div>
          {[{l:"Degree",v:selS.deg},{l:"CGPA",v:selS.cgpa.toFixed(2)},{l:"Goal",v:selS.goal},{l:"Work Pref",v:selS.work}].map(d=><div key={d.l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${T.border}`,fontSize:12}}>
            <span style={{color:T.muted}}>{d.l}</span><span style={{fontWeight:600}}>{d.v}</span>
          </div>)}
          <div style={{marginTop:10}}>
            <div style={{fontSize:11,color:T.muted,marginBottom:5}}>Key Interests</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{selS.interests.map(t=><span key={t} style={{background:T.teal+"15",color:T.teal,padding:"2px 8px",borderRadius:5,fontSize:10.5,fontWeight:500}}>{t}</span>)}</div>
          </div>
        </div>

        {score&&<div style={{background:T.card,border:`1px solid ${T.emerald}30`,borderRadius:13,padding:"16px 18px",animation:"fadeIn 0.3s ease"}}>
          <div style={{fontSize:13,fontWeight:700,fontFamily:"'Sora',sans-serif",marginBottom:8}}>📊 Session Score</div>
          <div style={{fontSize:34,fontWeight:800,color:T.emerald,fontFamily:"'Sora',sans-serif",lineHeight:1}}>{score}</div>
          <div style={{fontSize:11,color:T.muted,marginBottom:8}}>/100 · {msgs.filter(m=>m.role==="user").length} answers</div>
          <Pbar v={score} color={score>=75?T.emerald:score>=55?T.teal:T.gold} h={7}/>
          <div style={{fontSize:11.5,color:T.muted,marginTop:8,lineHeight:1.5}}>{score>=80?"Strong performance — ready for real interviews":score>=65?"Solid foundation — keep practising":"More preparation needed — focus on clarity"}</div>
        </div>}

        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:13,padding:"16px 18px"}}>
          <div style={{fontSize:13,fontWeight:700,fontFamily:"'Sora',sans-serif",marginBottom:9}}>💡 Tips</div>
          {["Use STAR format for situational questions","Be specific — name the tools you used","Keep answers focused, under 90 seconds","Ask a question back to show initiative","Research the company before real interviews"].map((t,i)=><div key={i} style={{display:"flex",gap:7,fontSize:12,color:T.muted,marginBottom:7,lineHeight:1.5}}>
            <span style={{color:T.teal,flexShrink:0}}>→</span>{t}
          </div>)}
        </div>
      </div>
    </div>
  </div>;
}

// ── Nav config ────────────────────────────────────────────────────────────────
const NAVS={
  student:[{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"roster",label:"Classmates",icon:"👥"},{id:"fyp",label:"FYP Tracker",icon:"🏗️"},{id:"recs",label:"Recommendations",icon:"💡"},{id:"industry",label:"Internships",icon:"🏢"},{id:"interview",label:"AI Mock Interview",icon:"🎤"}],
  mentor: [{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"roster",label:"All Students",icon:"👥"},{id:"fyp",label:"FYP Tracker",icon:"🏗️"},{id:"mentor",label:"Mentor Dashboard",icon:"🎓"},{id:"industry",label:"Industry Portal",icon:"🏢"}],
  industry:[{id:"dashboard",label:"Overview",icon:"🏠"},{id:"industry",label:"Industry Portal",icon:"🏢"},{id:"fyp",label:"FYP Tracker",icon:"🏗️"}]
};
const PTITLES={dashboard:"Dashboard",roster:"Students",fyp:"FYP Tracker",recs:"Recommendations",mentor:"Mentor Dashboard",industry:"Industry Portal",interview:"AI Mock Interview"};

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const rc={student:T.teal,mentor:T.violet,industry:T.emerald};

  if(!user)return <Login onLogin={u=>{setUser(u);setPage("dashboard");}}/>;

  const nav=NAVS[user.role]||NAVS.student;
  const render=()=>{
    switch(page){
      case"dashboard":return <Dashboard/>;
      case"roster":return <Roster/>;
      case"fyp":return <FYPTracker/>;
      case"recs":return <Recommendations/>;
      case"mentor":return <MentorDashboard/>;
      case"industry":return <IndustryPortal role={user.role}/>;
      case"interview":return <MockInterview user={user}/>;
      default:return <Dashboard/>;
    }
  };

  return <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:T.bg,minHeight:"100vh",display:"flex",color:T.text}}>
    {/* Sidebar */}
    <div style={{width:224,background:T.ink,display:"flex",flexDirection:"column",minHeight:"100vh",position:"sticky",top:0,flexShrink:0}}>
      <div style={{padding:"16px 18px 14px",borderBottom:`1px solid ${T.inkLL}`}}><Logo/></div>

      {/* User pill */}
      <div style={{margin:"10px 12px 4px",padding:"9px 11px",background:T.inkLL,borderRadius:9,display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:30,height:30,borderRadius:"50%",background:rc[user.role]+"25",border:`1.5px solid ${rc[user.role]}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>
          {{student:"🎓",mentor:"👨‍🏫",industry:"🏢"}[user.role]}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{color:"#fff",fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div>
          <div style={{color:rc[user.role],fontSize:10,fontWeight:600,textTransform:"capitalize"}}>{user.role}</div>
        </div>
        <button onClick={()=>{setUser(null);setPage("dashboard");}} title="Sign out" style={{background:"none",border:"none",color:"#374151",cursor:"pointer",fontSize:15,lineHeight:1,padding:2}}>×</button>
      </div>

      <div style={{flex:1,padding:"8px 0"}}>
        {nav.map(n=><div key={n.id} onClick={()=>setPage(n.id)} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 18px",cursor:"pointer",borderLeft:page===n.id?`3px solid ${T.teal}`:"3px solid transparent",background:page===n.id?T.tealD+"28":"transparent",color:page===n.id?"#fff":"#94A3B8",fontSize:13,fontWeight:page===n.id?600:400,transition:"all 0.12s"}}>
          <span style={{fontSize:14}}>{n.icon}</span><span>{n.label}</span>
        </div>)}
      </div>

      <div style={{padding:"10px 12px",borderTop:`1px solid ${T.inkLL}`}}>
        <div style={{color:"#374151",fontSize:9.5,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:7}}>Cohort</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {STUDENTS.map((m,i)=><div key={m.id} title={m.name} style={{cursor:"pointer"}} onClick={()=>setPage("roster")}>
            <Av ini={m.ini} size={22} idx={i} extra={{border:`2px solid ${T.inkLL}`}}/>
          </div>)}
        </div>
      </div>
    </div>

    {/* Main */}
    <div style={{flex:1,overflow:"auto"}}>
      <div style={{background:T.card,borderBottom:`1px solid ${T.border}`,padding:"0 26px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:10}}>
        <div style={{fontSize:15,fontWeight:700,fontFamily:"'Sora',sans-serif"}}>{PTITLES[page]||"Dashboard"}</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:12,color:T.muted}}>{STUDENTS.length} students</span>
          <span style={{background:T.teal+"15",color:T.teal,padding:"3px 11px",borderRadius:20,fontSize:11,fontWeight:700}}>Avg Readiness: {avgReady}%</span>
          <Mark size={30}/>
        </div>
      </div>
      <div style={{padding:"22px 26px"}}>{render()}</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
